# =============================================================================
# Edge Telemetry — Full Stack Compose
# Phase 5: Multi-node simulation
#
# Services:
#   postgres     PostgreSQL 16 — persistent metric storage
#   backend      Ktor REST + gRPC coordination server
#   ai-engine    FastAPI Z-score anomaly detection
#   agent-dev1   Edge agent instance 1 (device_id=dev1)
#   agent-dev2   Edge agent instance 2 (device_id=dev2)
#   agent-dev3   Edge agent instance 3 (device_id=dev3)
#
# All services share the private bridge network `telemetry-net`.
# No service is reachable from outside the host except via the declared
# ports — postgres is intentionally NOT exposed externally here.
#
# Usage:
#   podman-compose up -d               start everything
#   podman-compose up -d --scale ...   (not used — agents are explicit)
#   podman-compose logs -f backend     follow backend logs
#   podman-compose down                stop and remove containers
#   podman-compose down -v             also remove postgres data volume
#
# For backend-only dev (no containers except DB), use backend/compose.yaml.
# =============================================================================

networks:
  telemetry-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:

  postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    networks:
      - telemetry-net
    environment:
      POSTGRES_DB:       telemetry
      POSTGRES_USER:     telemetry
      POSTGRES_PASSWORD: telemetry
    volumes:
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context:    ./backend
      dockerfile: Containerfile
    container_name: telemetry-backend
    networks:
      - telemetry-net
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      DATABASE_URL:      jdbc:postgresql://postgres:5432/telemetry
      DATABASE_USER:     telemetry
      DATABASE_PASSWORD: telemetry
      DATABASE_POOL_SIZE: "10"
      AI_ENGINE_URL:     http://ai-engine:8000
      ANOMALY_INTERVAL_SECONDS: "30"
      ANOMALY_WINDOW_MINUTES:   "60"
      HTTP_PORT:  "8080"
      GRPC_PORT:  "50051"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:         ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval:     10s
      timeout:      5s
      retries:      6
      start_period: 30s
    restart: unless-stopped

  ai-engine:
    build:
      context:    ./ai-engine
      dockerfile: Containerfile
    container_name: telemetry-ai
    networks:
      - telemetry-net
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ANOMALY_THRESHOLD: "3.0"
      AI_ENGINE_HOST:    "0.0.0.0"
      AI_ENGINE_PORT:    "8000"
    restart: unless-stopped

  agent-dev1:
    build:
      context:    ./agent
      dockerfile: Containerfile
    container_name: telemetry-agent-dev1
    networks:
      - telemetry-net
    environment:
      DEVICE_ID:         dev1
      BACKEND_ADDR:      backend:50051
      SAMPLING_INTERVAL: 5s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  agent-dev2:
    build:
      context:    ./agent
      dockerfile: Containerfile
    container_name: telemetry-agent-dev2
    networks:
      - telemetry-net
    environment:
      DEVICE_ID:         dev2
      BACKEND_ADDR:      backend:50051
      SAMPLING_INTERVAL: 5s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  agent-dev3:
    build:
      context:    ./agent
      dockerfile: Containerfile
    container_name: telemetry-agent-dev3
    networks:
      - telemetry-net
    environment:
      DEVICE_ID:         dev3
      BACKEND_ADDR:      backend:50051
      SAMPLING_INTERVAL: 5s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
