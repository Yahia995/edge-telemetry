# =============================================================================
# Edge Telemetry — Full Stack Compose (Phase 6)
#
# Changes from Phase 5:
#   - agent-dev1: ENABLE_EBPF=true, capabilities added (CAP_BPF, etc.)
#   - agent-dev2, agent-dev3: ENABLE_EBPF=false (control group for comparison)
#
# This configuration lets you compare dev1 (with TCP events) against
# dev2/dev3 (without) in the same dashboard run. The backend handles both
# transparently since TcpMetric is just another oneof payload variant.
#
# Capability notes:
#   CAP_BPF:       load BPF programs, create BPF maps (Linux 5.8+)
#   CAP_PERFMON:   attach to kernel tracepoints
#   CAP_NET_ADMIN: required by some BPF socket/tc programs
#   CAP_SYS_PTRACE:read /proc/<pid>/comm (process names in TCP events)
#
# For production, grant only the capabilities actually needed by your
# kernel version and BPF program type. On kernels < 5.8, CAP_SYS_ADMIN
# covers CAP_BPF functionality but is broader — avoid in production.
#
# apparmor:unconfined is required on Ubuntu hosts with AppArmor enabled.
# Fedora uses SELinux; no apparmor: line is needed there.
# =============================================================================

networks:
  telemetry-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:

  postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    networks:
      - telemetry-net
    environment:
      POSTGRES_DB:       telemetry
      POSTGRES_USER:     telemetry
      POSTGRES_PASSWORD: telemetry
    volumes:
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context:    ./backend
      dockerfile: Containerfile
    container_name: telemetry-backend
    networks:
      - telemetry-net
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      DATABASE_URL:             jdbc:postgresql://postgres:5432/telemetry
      DATABASE_USER:            telemetry
      DATABASE_PASSWORD:        telemetry
      DATABASE_POOL_SIZE:       "10"
      AI_ENGINE_URL:            http://ai-engine:8000
      ANOMALY_INTERVAL_SECONDS: "30"
      ANOMALY_WINDOW_MINUTES:   "60"
      HTTP_PORT:                "8080"
      GRPC_PORT:                "50051"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:         ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval:     10s
      timeout:      5s
      retries:      6
      start_period: 30s
    restart: unless-stopped

  ai-engine:
    build:
      context:    ./ai-engine
      dockerfile: Containerfile
    container_name: telemetry-ai
    networks:
      - telemetry-net
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ANOMALY_THRESHOLD: "3.0"
      AI_ENGINE_HOST:    "0.0.0.0"
      AI_ENGINE_PORT:    "8000"
    restart: unless-stopped

  agent-dev1:
    build:
      context:    ./agent
      dockerfile: Containerfile
    container_name: telemetry-agent-dev1
    networks:
      - telemetry-net
    environment:
      DEVICE_ID:         dev1
      BACKEND_ADDR:      backend:50051
      SAMPLING_INTERVAL: 5s
      ENABLE_EBPF:       "true"
      BPF_OBJECT_PATH:   /home/agent/ebpf/tcp_events.o
    cap_add:
      - BPF
      - PERFMON
      - NET_ADMIN
      - SYS_PTRACE
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  agent-dev2:
    build:
      context:    ./agent
      dockerfile: Containerfile
    container_name: telemetry-agent-dev2
    networks:
      - telemetry-net
    environment:
      DEVICE_ID:         dev2
      BACKEND_ADDR:      backend:50051
      SAMPLING_INTERVAL: 5s
      ENABLE_EBPF:       "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  agent-dev3:
    build:
      context:    ./agent
      dockerfile: Containerfile
    container_name: telemetry-agent-dev3
    networks:
      - telemetry-net
    environment:
      DEVICE_ID:         dev3
      BACKEND_ADDR:      backend:50051
      SAMPLING_INTERVAL: 5s
      ENABLE_EBPF:       "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
